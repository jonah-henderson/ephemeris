# Mod identity lives in `mod.properties` — see the note there.

# Gradle
# Gradle loads its own native library, which Java 24 and on warn of unless native access is granted.
org.gradle.jvmargs=-Xmx3G --enable-native-access=ALL-UNNAMED
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
